    - assets/characters/male_06_reference_v2.png
    - assets/characters/male_07_reference_v2.png
    - assets/characters/male_08_reference_v2.png
    - assets/characters/motion_sheets/female_01_run_cycle_v16.png
    - assets/characters/motion_sheets/female_02_run_cycle_v16.png
    - assets/characters/motion_sheets/female_03_run_cycle_v16.png
