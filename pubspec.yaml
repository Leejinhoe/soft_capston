name: fairytale_hyeonlim_merged
description: "Hyeonlim frontend merged with Jinhoe fairytale features."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_dotenv: ^5.1.0
  provider: ^6.1.2
  google_fonts: ^6.2.1
  percent_indicator: ^4.2.3
  audioplayers: ^6.5.1
  record: ^6.1.1
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7

  cupertino_icons: ^1.0.8
  http: ^1.6.0

  kakao_flutter_sdk: 1.9.0

  # 🚀 구글 로그인
  google_sign_in: ^6.2.1
  google_sign_in_web: ^0.12.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/characters/female_01_reference_v2.png
    - assets/characters/female_02_reference_v2.png
    - assets/characters/female_03_reference_v2.png
    - assets/characters/female_04_reference_v2.png
    - assets/characters/female_05_reference_v2.png
    - assets/characters/female_06_reference_v2.png
    - assets/characters/female_07_reference_v2.png
    - assets/characters/female_08_reference_v2.png
    - assets/characters/male_01_reference_v2.png
    - assets/characters/male_02_reference_v2.png
    - assets/characters/male_03_reference_v2.png
    - assets/characters/male_04_reference_v2.png
